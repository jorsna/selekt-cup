<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCSO Selekt Cup – Sesongfinale · Q3 2026</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script>
/* ══════════════════════════════════════════════════════════════════════
   MATCHDAY · MVP.JS  ·  v1.0
   Kanonisk definisjon av «MVP-dag». Denne blokken er IDENTISK i alle
   filer i alle tre konkurransene. Endres den ett sted, må den byttes
   ut alle steder – den genereres fra én kilde.

   DEFINISJONEN
   ------------
   1. Dagen avgjøres av OSLO-dato (Europe/Oslo), ikke UTC.
   2. Høyest poeng den dagen tar MVP.
   3. Står det likt: konkurransens tiebreaker (finansiert / 10-ere).
   4. Fortsatt likt -> DELT MVP. Alle vinnerne får én hel MVP-dag hver.
   5. Slettede rader (deleted) og ugyldige rader teller aldri.

   Samme stige som ukesvinner og bruksanvisningen. Ett sted, én sannhet.
   ══════════════════════════════════════════════════════════════════════ */
(function (global) {
  'use strict';

  /* ── Oslo-dato fra ts (som er lagret som ISO-tekst, ikke timestamptz) ── */
  function osloDato(ts) {
    if (!ts) return null;
    var d = new Date(ts);
    if (isNaN(d.getTime())) return null;
    return d.toLocaleDateString('sv-SE', { timeZone: 'Europe/Oslo' }); // YYYY-MM-DD
  }

  /* ── Standardoppsett = Championship / Selekt ────────────────────────── */
  var STANDARD = {
    navnFelt: 'selger',
    gyldig: function (r) { return !r.deleted; },
    poeng: function (r) { return 3 + (r.spotlight_bonus || 0); },
    tie: function (r) { return r.finansiert ? 1 : 0; },
    tieNavn: 'finansierte salg'
  };

  /* ── Ferdig oppsett for OSAT ────────────────────────────────────────── */
  var OSAT = {
    navnFelt: 'pst',
    gyldig: function (r) { return !r.deleted && (r.score === 9 || r.score === 10); },
    poeng: function () { return 3; },
    tie: function (r) { return r.score === 10 ? 1 : 0; },
    tieNavn: '10-ere'
  };

  function medStandard(cfg) {
    cfg = cfg || {};
    return {
      navnFelt: cfg.navnFelt || STANDARD.navnFelt,
      gyldig: cfg.gyldig || STANDARD.gyldig,
      poeng: cfg.poeng || STANDARD.poeng,
      tie: cfg.tie || STANDARD.tie,
      tieNavn: cfg.tieNavn || STANDARD.tieNavn
    };
  }

  /* ══════════════════════════════════════════════════════════════════
     KJERNE: grupperer rader per Oslo-dato og kårer dagens vinner(e).
     ══════════════════════════════════════════════════════════════════ */
  function grupper(rader, cfg) {
    var dager = {};
    (rader || []).forEach(function (r) {
      if (!cfg.gyldig(r)) return;
      var d = osloDato(r.ts);
      if (!d) return;
      var navn = r[cfg.navnFelt];
      if (!navn) return;
      if (!dager[d]) dager[d] = {};
      if (!dager[d][navn]) dager[d][navn] = { poeng: 0, tie: 0, antall: 0, forsteTs: r.ts };
      var p = dager[d][navn];
      p.poeng += cfg.poeng(r);
      p.tie += cfg.tie(r);
      p.antall += 1;
      if (r.ts && r.ts < p.forsteTs) p.forsteTs = r.ts;
    });
    return dager;
  }

  /* Kårer vinner(e) for ÉN dag. Returnerer null hvis ingen aktivitet. */
  function karDag(spillere) {
    var navn = Object.keys(spillere || {});
    if (!navn.length) return null;

    var maksPoeng = 0;
    navn.forEach(function (n) { if (spillere[n].poeng > maksPoeng) maksPoeng = spillere[n].poeng; });
    if (maksPoeng <= 0) return null;

    var likt = navn.filter(function (n) { return spillere[n].poeng === maksPoeng; });

    var maksTie = 0;
    likt.forEach(function (n) { if (spillere[n].tie > maksTie) maksTie = spillere[n].tie; });
    var vinnere = likt.filter(function (n) { return spillere[n].tie === maksTie; });

    return {
      vinnere: vinnere.sort(),
      poeng: maksPoeng,
      tie: maksTie,
      antall: spillere[vinnere[0]].antall,
      delt: vinnere.length > 1,
      avgjortAvTie: vinnere.length < likt.length
    };
  }

  /* ══════════════════════════════════════════════════════════════════
     beregnMVPdager(rader, cfg)
     Hovedfunksjonen. Ett kall gir alt noen visning trenger.
     ══════════════════════════════════════════════════════════════════ */
  function beregnMVPdager(rader, cfg) {
    cfg = medStandard(cfg);
    var gruppert = grupper(rader, cfg);
    var dager = Object.keys(gruppert).sort();

    var perDag = {};
    var aktiveDager = [];
    var telling = {};

    dager.forEach(function (d) {
      var res = karDag(gruppert[d]);
      if (!res) return;
      perDag[d] = res;
      aktiveDager.push(d);
      res.vinnere.forEach(function (n) { telling[n] = (telling[n] || 0) + 1; });
    });

    var perSpiller = {};
    Object.keys(telling).forEach(function (n) {
      perSpiller[n] = {
        navn: n,
        antall: telling[n],
        dager: aktiveDager.filter(function (d) { return perDag[d].vinnere.indexOf(n) !== -1; }),
        // parallell til aktiveDager – true på dagene spilleren tok MVP
        maske: aktiveDager.map(function (d) { return perDag[d].vinnere.indexOf(n) !== -1; })
      };
    });

    var rangert = Object.keys(perSpiller)
      .map(function (n) { return perSpiller[n]; })
      .sort(function (a, b) { return b.antall - a.antall || a.navn.localeCompare(b.navn, 'nb'); });

    var topp = rangert.length
      ? rangert.filter(function (x) { return x.antall === rangert[0].antall; })
      : [];

    return {
      dager: aktiveDager,      // alle dager med aktivitet, sortert stigende
      perDag: perDag,          // { '2026-08-03': {vinnere,poeng,tie,delt,...} }
      perSpiller: perSpiller,  // { navn: {antall, dager, maske} }
      rangert: rangert,        // hele topplista, synkende
      topp: topp,              // leder(e) – flere ved likt
      tieNavn: cfg.tieNavn
    };
  }

  /* ══════════════════════════════════════════════════════════════════
     forDag(rader, dato, cfg)
     Kårer MVP for én bestemt Oslo-dato. Brukes av MVP-banneret.
     Returnerer null hvis ingen aktivitet den dagen.
     ══════════════════════════════════════════════════════════════════ */
  function forDag(rader, dato, cfg) {
    cfg = medStandard(cfg);
    var gruppert = grupper(rader, cfg);
    return karDag(gruppert[dato]);
  }

  /* Dagens Oslo-dato som YYYY-MM-DD. */
  function iDag() {
    return new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Oslo' });
  }

  global.MatchdayMVP = {
    beregnMVPdager: beregnMVPdager,
    forDag: forDag,
    osloDato: osloDato,
    iDag: iDag,
    STANDARD: STANDARD,
    OSAT: OSAT,
    versjon: '1.0'
  };
})(typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : this));
</script>

<script>
(function(){
  const c=document.getElementById('particles'),ctx=c.getContext('2d');
  let W,H,pts=[];
  function resize(){W=c.width=innerWidth;H=c.height=innerHeight;}
  resize();window.addEventListener('resize',resize);
  const COLS=[[34,197,94],[201,168,76],[240,201,110],[134,239,172],[22,163,74]];
  for(let i=0;i<110;i++){
    const col=COLS[Math.floor(Math.random()*COLS.length)];
    pts.push({x:Math.random()*9999,y:Math.random()*9999,r:Math.random()*1.5+0.2,
      vx:(Math.random()-0.5)*0.2,vy:-(Math.random()*0.35+0.05),
      life:Math.random(),maxLife:Math.random()*0.6+0.4,col,drift:Math.random()*Math.PI*2,driftS:Math.random()*0.01+0.003});
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    pts.forEach(p=>{
      p.life+=0.0022;p.drift+=p.driftS;
      if(p.life>p.maxLife){p.life=0;p.x=Math.random()*W;p.y=H+10;}
      p.x+=p.vx+Math.sin(p.drift)*0.35;p.y+=p.vy;
      const t=p.life/p.maxLife,a=t<0.15?t/0.15:t>0.8?(1-t)/0.2:1;
      ctx.save();ctx.globalAlpha=a*0.45;ctx.fillStyle=`rgb(${p.col.join(',')})`;
      ctx.shadowBlur=10;ctx.shadowColor=`rgba(${p.col.join(',')},0.9)`;
      ctx.beginPath();ctx.arc(p.x%W,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

/* ── SESONG 2-FILTER ────────────────────────────────────────────────
   Tabellen inneholder også sesong 1-rader, så alt filtreres til sesong 2
   (ts er lokal norsk tid som tekst → sammenlign på de ti første tegnene).
   UTELATT: deltakere som ikke skal telle verken individuelt, i
   avdelingspoeng eller i divisoren (besluttet 29.09.2026). */
const SESONG_FRA='2026-08-03', SESONG_TIL='2026-09-30';
const UTELATT=[];
function sesongFilter(rows){
  return (rows||[]).filter(r=>{
    const d=String(r.ts||'').slice(0,10);
    return d>=SESONG_FRA && d<=SESONG_TIL && !r.deleted && !UTELATT.includes(r.selger);
  });
}

function nameToId(n){
  return n.toLowerCase().replace(/\s+/g,'_')
    .replace(/æ/g,'ae').replace(/ø/g,'o').replace(/å/g,'aa').replace(/[^a-z0-9_]/g,'');
}
function hexA(hex,a){
  const h=hex.replace('#','');
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}
const shimGrad=(dark,accent,soft)=>`linear-gradient(90deg,${dark},${accent},${soft},#ffffff,${accent},${dark})`;
const ringGrad=(dark,accent,soft)=>`conic-gradient(${dark},${soft},${accent},#ffffff,${soft},${dark})`;

function useBurst(ref,colors,enabled){
  useEffect(()=>{
    if(!enabled)return;const c=ref.current;if(!c)return;
    const ctx=c.getContext&&c.getContext("2d");if(!ctx)return;
    const w=c.width=c.offsetWidth||320,h=c.height=c.offsetHeight||440;
    const ps=[];
    for(let i=0;i<70;i++)ps.push({x:w/2+(Math.random()-0.5)*w*0.55,y:h*0.16+Math.random()*24,
      vx:(Math.random()-0.5)*2.4,vy:Math.random()*1.3+0.4,r:Math.random()*2.2+0.6,
      col:colors[(Math.random()*colors.length)|0],life:0,max:Math.random()*55+70});
    let raf,frame=0;
    function step(){
      ctx.clearRect(0,0,w,h);frame++;let alive=false;
      ps.forEach(p=>{p.life++;if(p.life>p.max)return;alive=true;p.x+=p.vx;p.y+=p.vy;p.vy+=0.022;
        ctx.save();ctx.globalAlpha=Math.max(0,1-p.life/p.max);ctx.fillStyle=p.col;ctx.shadowBlur=8;ctx.shadowColor=p.col;
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();});
      if(alive&&frame<210)raf=requestAnimationFrame(step);else ctx.clearRect(0,0,w,h);
    }
    step();return ()=>{if(raf)cancelAnimationFrame(raf);};
  },[enabled]);
}

function AnimNum({value,color,suffix=""}){
  const[n,setN]=useState(0);
  useEffect(()=>{
    if(!value)return;let start=null;
    function step(ts){if(!start)start=ts;const p=Math.min((ts-start)/1100,1),e=1-Math.pow(1-p,4);setN(Math.round(e*value));if(p<1)requestAnimationFrame(step);}
    requestAnimationFrame(step);
  },[value]);
  return <span style={{color}}>{n}{suffix}</span>;
}

/* ── Sesongberegning ──────────────────────────────────────────────── */
function rankSeason(sales){
  const m={};
  sales.forEach(x=>{
    const n=x.selger;if(!n)return;
    if(!m[n])m[n]={name:n,salg:0,finansiert:0,pts:0,loc:x.loc,lastTs:x.ts};
    m[n].salg++;m[n].pts+=PTS+(x.spotlight_bonus||0);
    if(x.finansiert)m[n].finansiert++;
    if(x.ts>m[n].lastTs)m[n].lastTs=x.ts;
  });
  return Object.values(m).sort((a,b)=>b.pts-a.pts||b.finansiert-a.finansiert||a.lastTs.localeCompare(b.lastTs));
}
function deptStandings(sales){
  const head={};Object.values(ROSTER).forEach(loc=>{head[loc]=(head[loc]||0)+1;});
  const pts={},salg={};Object.keys(head).forEach(l=>{pts[l]=0;salg[l]=0;});
  sales.forEach(s=>{const l=s.loc;if(pts[l]!=null){pts[l]+=PTS+(s.spotlight_bonus||0);salg[l]++;}});
  return Object.keys(head).map(loc=>({loc,pts:pts[loc],salg:salg[loc],head:head[loc],pps:head[loc]?pts[loc]/head[loc]:0})).sort((a,b)=>b.pps-a.pps);
}
function getMVPs(ws){
  /* Felles definisjon - se MatchdayMVP øverst. Poeng -> finansiert -> delt. Oslo-dato. */
  const r=MatchdayMVP.beregnMVPdager(ws);
  return r.topp.map(p=>({
    name:p.navn, count:p.antall,
    loc:ws.find(s=>s.selger===p.navn)?.loc||"",
    days:r.dager
  }));
}

            <div key={i} className="champ-stat" style={{animationDelay:s.delay}}>
              <div className="champ-stat-num"><AnimNum value={s.val} color={s.c}/></div>
              <div className="champ-stat-lbl">{s.lbl}</div>
            </div>
          ))}
        </div>
        <div className="champ-down">▾ &nbsp; PALLEN · VINNERAVDELING · RENTEHAI · MVP · REKORDER &nbsp; ▾</div>
      </div>
    </div>
  );
}

/* ── Sesongpallen (kompakt bro) ───────────────────────────────────── */
function PallCard({ranked}){
  if(ranked.length<2)return null;
  const top=ranked.slice(0,3);const medals=["🥇","🥈","🥉"];const mc=["#f0c96e","#c0c0c0","#cd7f32"];
  return(
    <div className="sec r3" style={{margin:'18px 16px'}}>
      <div className="sec-top" style={{background:'linear-gradient(90deg,transparent,rgba(201,168,76,0.7),transparent)'}}/>
      <div className="sec-title">🏅 Sesongpallen</div>
      {top.map((p,i)=>{const col=dc(p.loc);return(
        <div key={p.name} className="rank-row">
          <div className="rank-num" style={{color:mc[i],fontSize:i===0?22:18}}>{medals[i]}</div>
          <SmallAvatar name={p.name} loc={p.loc} size={i===0?44:38}/>
          <div style={{flex:1}}>
            <div className="rank-name" style={{color:i===0?'#fff':'rgba(255,255,255,0.78)',fontSize:i===0?15:14}}>{p.name}</div>
            <div className="rank-dept" style={{color:col+'cc'}}>{dl(p.loc)} · {p.salg} biler · {p.finansiert} fin</div>
          </div>
          <div style={{textAlign:'right'}}>
            <div className="rank-pts" style={{color:mc[i]}}>{p.pts}</div>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:7,letterSpacing:'0.15em',color:'rgba(255,255,255,0.25)',marginTop:2}}>POENG</div>
          </div>
        </div>
      );})}
    </div>
  );
}

/* ── Vinneravdeling (headliner #2, avdelingsfarget) ───────────────── */
function VinneravdelingMoment({depts}){
  if(!depts.length)return null;
  const best=depts[0];const D=DEPT[best.loc]||{};
  const accent=D.color||"#4a8fff",soft=D.soft||"#8fc0ff",dark=D.dark||"#27508f";
  const sub=(
    <div style={{margin:'18px 4px 2px',position:'relative',zIndex:2}}>
      <div style={{fontFamily:"'Cinzel',serif",fontSize:9,letterSpacing:'0.3em',color:'rgba(255,255,255,0.25)',textAlign:'center',marginBottom:12}}>— AVDELINGSKAMPEN —</div>
      {depts.map((d,i)=>{const c=dc(d.loc);return(
        <div key={d.loc} className="mom-sub-row">
          <span style={{fontFamily:"'Playfair Display',serif",fontWeight:700,width:22,textAlign:'center',color:i===0?soft:'rgba(255,255,255,0.5)'}}>{i+1}</span>
          <span style={{flex:1,fontWeight:600,color:i===0?'#fff':'rgba(255,255,255,0.7)'}}>{dl(d.loc)}</span>
          <span style={{fontSize:11,color:c+'aa',marginRight:8}}>{d.salg} biler · {d.head} selgere</span>
          <span style={{fontFamily:"'Playfair Display',serif",fontWeight:700,color:i===0?soft:'rgba(255,255,255,0.6)'}}>{d.pps.toFixed(1).replace('.',',')}</span>
        </div>
      );})}
    </div>
  );
  return <Moment rkey="r3" particles={true} accent={accent} soft={soft} dark={dark}
    icon="🏆" eyebrow="VINNERAVDELING" name={dl(best.loc)} honor="Sesongens beste avdeling"
    badge={<Crest initials={dl(best.loc).slice(0,2).toUpperCase()} accent={accent} soft={soft} dark={dark}/>}
    hero={best.pps.toFixed(1).replace('.',',')} heroLabel="POENG PER SELGER"
    tiles={[{num:best.pts,lbl:'Poeng totalt',col:soft},{num:best.salg,lbl:'Biler',col:accent},{num:best.head,lbl:'Selgere',col:'#cfe2ff'}]}
    sub={sub}/>;
}

/* ── Sesongens Rentehai ───────────────────────────────────────────── */
function RentehaiMoment({rentehaier}){
  if(!rentehaier.length)return null;
  const r=rentehaier[0];const accent="#5fb8d8",soft="#a8e0f0",dark="#2a7a96";
  const sub=rentehaier.length>1?(
    <div className="mom-shared">
      {rentehaier.slice(1).map(x=>(
        <span key={x.name} style={{display:'inline-flex',alignItems:'center',gap:8,color:'rgba(255,255,255,0.7)',fontWeight:600,fontSize:14}}>
          <SmallAvatar name={x.name} loc={x.loc} size={30}/>{x.name}
        </span>
      ))}
    </div>
  ):null;
  return <Moment rkey="r4" accent={accent} soft={soft} dark={dark}
    icon="🦈" eyebrow={rentehaier.length>1?"DELT SESONGENS RENTEHAI":"SESONGENS RENTEHAI"}
    name={r.name} honor="Flest finansierte salg i sesongen"
    badge={<Portrait name={r.name} loc={r.loc} accent={accent} soft={soft}/>}
    hero={r.finansiert} heroLabel="FINANSIERTE SALG" sub={sub}/>;
}

/* ── Flest MVP-dager ──────────────────────────────────────────────── */
function MVPMoment({mvps}){
  if(!mvps.length)return null;
  const m=mvps[0];const accent="#f0b552",soft="#ffdd8f",dark="#8a5e14";
  const sub=mvps.length>1?(
    <div className="mom-shared">
      {mvps.slice(1).map(x=>(
        <span key={x.name} style={{display:'inline-flex',alignItems:'center',gap:8,color:'rgba(255,255,255,0.7)',fontWeight:600,fontSize:14}}>
          <SmallAvatar name={x.name} loc={x.loc} size={30}/>{x.name}
        </span>
      ))}
    </div>
  ):null;
  return <Moment rkey="r4" accent={accent} soft={soft} dark={dark}
    icon="👑" eyebrow={mvps.length>1?"DELT FLEST MVP-DAGER":"FLEST MVP-DAGER"}
    name={m.name} honor={`MVP ${m.count} av ${m.days.length} salgsdag${m.days.length>1?"er":""}`}
    badge={<Portrait name={m.name} loc={m.loc} accent={accent} soft={soft}/>}
    hero={m.count} heroLabel="MVP-DAGER" sub={sub}/>;
}

/* ── Flest hat-tricks ─────────────────────────────────────────────── */
function HatTrickMoment({hatters,sales}){
  if(!hatters.length)return null;
  const h=hatters[0];const accent="#27c98a",soft="#7fe3bf",dark="#176f4f";
  const days={};
  sales.filter(s=>s.selger===h.name).forEach(s=>{const d=MatchdayMVP.osloDato(s.ts);days[d]=(days[d]||0)+1;});
  const htDays=Object.entries(days).filter(([,c])=>c>=3).map(([d,c])=>({d,c})).sort((a,b)=>a.d.localeCompare(b.d));
  const sub=(
    <div style={{margin:'16px 2px 0',position:'relative',zIndex:2}}>
      {htDays.map(({d,c})=>(
        <div key={d} className="ht-row">
          <div className="ht-dot"/><span className="ht-ct">{c} salg</span>
          <span style={{color:'rgba(255,255,255,0.25)'}}>—</span>
          <span className="ht-dt">{new Date(d).toLocaleDateString("no-NO",{weekday:"long",day:"numeric",month:"long"})}</span>
        </div>
      ))}
      {hatters.length>1&&(
        <div className="mom-shared" style={{marginTop:12}}>
          {hatters.slice(1).map(x=>(
            <span key={x.name} style={{display:'inline-flex',alignItems:'center',gap:8,color:'rgba(255,255,255,0.7)',fontWeight:600,fontSize:14}}>
              <SmallAvatar name={x.name} loc={x.loc} size={30}/>{x.name} ({x.htCount})
            </span>
          ))}
        </div>
      )}
    </div>
  );
  return <Moment rkey="r4" accent={accent} soft={soft} dark={dark}
    icon="⭐" eyebrow="FLEST HAT-TRICKS" name={h.name}
    honor={`${h.htCount} hat-trick-dag${h.htCount>1?"er":""} i sesongen`}
    badge={<Portrait name={h.name} loc={h.loc} accent={accent} soft={soft}/>}
    hero={h.htCount} heroLabel="HAT-TRICKS" sub={sub}/>;
}

/* ── Sesongen i tall ──────────────────────────────────────────────── */
function SesongStats({sales}){
  const totSalg=sales.length;
  const totFin=sales.filter(s=>s.finansiert).length;
  const finPct=totSalg?Math.round(totFin/totSalg*100):0;
  const activeDays=new Set(sales.map(s=>MatchdayMVP.osloDato(s.ts))).size;
  return(
    <div className="r5" style={{margin:'18px 0 0'}}>
      <div style={{margin:'0 16px 8px'}}><div className="rank-title">Sesongen i tall</div></div>
      <div className="stats-bar">
        {[
          {val:totSalg,lbl:'Biler totalt',col:'var(--gold2)',delay:'0.6s'},
          {val:totFin,lbl:'Finansiert',col:'#f0c96e',delay:'0.72s'},
          {val:finPct,lbl:'Fin %',col:'#27c98a',delay:'0.84s',suffix:'%'},
          {val:activeDays,lbl:'Salgsdager',col:'#4a8fff',delay:'0.96s'},
        ].map(({val,lbl,col,delay,suffix},i)=>(
          <div key={i} className="stat-tile" style={{animationDelay:delay}}>
            <div className="stat-tile-num"><AnimNum value={val} color={col} suffix={suffix||""}/></div>
            <div className="stat-tile-lbl">{lbl}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── Ticker ───────────────────────────────────────────────────────── */
function Ticker({ranked,champ}){
  const items=ranked.slice(0,5).map((r,i)=>`${i+1}. ${r.name} · ${r.pts} p`).join("   ✦   ");
  const full=`✦ SESONGFINALE · ${SEASON_LABEL.toUpperCase()} · VCSO SELEKT CUP ✦   ${champ?`👑 VINNER: ${champ.name}   ✦   `:""}${items}   `;
  return(
    <div className="ticker-wrap">
      <div className="ticker-inner">
        <span className="ticker-chunk">{full}</span>
        <span className="ticker-chunk">{full}</span>
      </div>
    </div>
  );
}

/* ── App ──────────────────────────────────────────────────────────── */
function App(){
  const[sales,setSales]=useState(null);
  const[error,setError]=useState(null);
  useEffect(()=>{
    if(FROZEN_SALES){setSales(sesongFilter(FROZEN_SALES));return;}
    fetch(SB_URL+"/rest/v1/selekt_sales?select=*&deleted=eq.false&order=ts.asc",
      {headers:{apikey:SB_KEY,Authorization:"Bearer "+SB_KEY}})
    .then(r=>r.ok?r.json():Promise.reject(r.statusText))
    .then(r=>setSales(sesongFilter(r))).catch(e=>setError(String(e)));
  },[]);

  if(error)return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',color:'#ef4444',fontFamily:'Rajdhani',padding:24,textAlign:'center'}}>
      <div><div style={{fontSize:36,marginBottom:12}}>⚠️</div>Feil: {error}</div>
    </div>
  );
  if(!sales)return(
    <div className="loading"><div className="spin-ring"/><div className="loading-lbl">Kroner sesongmesteren...</div></div>
  );

  const ranked=rankSeason(sales);
  const champ=ranked[0]||null;
  const depts=deptStandings(sales);
  const mvps=getMVPs(sales);
  const maxFin=Math.max(0,...ranked.map(r=>r.finansiert));
  const rentehaier=maxFin>0?ranked.filter(r=>r.finansiert===maxFin):[];
  const htMap={};
  sales.forEach(s=>{const d=MatchdayMVP.osloDato(s.ts);if(!htMap[s.selger])htMap[s.selger]={};htMap[s.selger][d]=(htMap[s.selger][d]||0)+1;});
  const hatters=Object.entries(htMap)
    .filter(([,d])=>Object.values(d).some(c=>c>=3))
    .map(([name])=>({name,loc:sales.find(s=>s.selger===name)?.loc||"",htCount:Object.values(htMap[name]).filter(c=>c>=3).length}))
    .sort((a,b)=>b.htCount-a.htCount);

  return(
    <div>
      <div className="header rf">
        <div className="eyebrow">VCSO Selekt Cup · 2026</div>
        <div className="header-trophy">🏆</div>
        <div className="header-title gold-text">Sesongfinale</div>
        <div className="header-sub">Den store kåringen</div>
        <div className="month-badge"><div className="badge-dot"/>{SEASON_LABEL}</div>
      </div>

      {sales.length===0?(
        <div style={{textAlign:'center',padding:'80px 24px',fontFamily:"'Playfair Display',serif",fontStyle:'italic',fontSize:18,color:'rgba(255,255,255,0.2)'}}>
          Ingen salg registrert i sesongen.
        </div>
      ):(
        <div className="content">
          <Ticker ranked={ranked} champ={champ}/>
          <div className="spacer"/>
          <ChampionCard champ={champ}/>
          <PallCard ranked={ranked}/>
          <VinneravdelingMoment depts={depts}/>
          <RentehaiMoment rentehaier={rentehaier}/>
          <MVPMoment mvps={mvps}/>
          <HatTrickMoment hatters={hatters} sales={sales}/>
          <SesongStats sales={sales}/>
          <div style={{margin:'18px 16px 24px',display:'flex',flexDirection:'column',gap:10}}>
            <a className="gz-cta" href={GAZZETTA_URL}>
              <span style={{fontSize:20}}>📰</span>
              <span>Les La Gazzetta — sesongoppsummering</span>
              <span style={{opacity:0.6}}>→</span>
            </a>
            <a className="gz-cta gz-cta-sec" href={TABELL_URL}>
              <span style={{fontSize:18}}>📊</span>
              <span>Se hele sluttabellen</span>
              <span style={{opacity:0.6}}>→</span>
            </a>
          </div>
          <div className="footer r6">
            <div className="footer-line"/>
            <div className="footer-txt">VCSO Selekt Cup · {SEASON_LABEL} · Sesongfinale</div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
